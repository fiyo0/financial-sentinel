<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Sentinel — Portfolio Intelligence & Sign In</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            950: '#060913',
                            900: '#0b1120',
                            800: '#111b33',
                            700: '#1e293b',
                            600: '#334155'
                        },
                        emerald: {
                            500: '#10b981',
                            400: '#34d399'
                        },
                        cyan: {
                            500: '#06b6d4',
                            400: '#22d3ee'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #060913;
            color: #f1f5f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .glow-shield {
            box-shadow: 0 0 50px -10px rgba(6, 182, 212, 0.2);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-dark-900 border border-slate-800/80 rounded-2xl p-8 glow-shield shadow-2xl relative overflow-hidden">
        <!-- Ambient background gradients -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-24 -left-24 w-48 h-48 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-14 h-14 bg-dark-800 border border-cyan-500/30 rounded-2xl flex items-center justify-center mx-auto mb-3 shadow-inner">
                <span class="text-2xl">⚡</span>
            </div>
            <h1 class="text-xl font-black tracking-tight text-white flex items-center justify-center space-x-2">
                <span>FINANCIAL</span>
                <span class="text-cyan-400">SENTINEL</span>
            </h1>
            <p class="text-[11px] text-slate-400 mt-1 uppercase tracking-widest font-semibold">Autonomous Portfolio Intelligence</p>
        </div>

        <!-- Tabs Navigation -->
        <div class="flex p-1 bg-dark-950 border border-slate-800 rounded-xl mb-6">
            <button id="tab-btn-login" onclick="switchAuthTab('login')" class="flex-1 py-2 text-xs font-bold rounded-lg transition bg-cyan-600 text-white shadow-sm">
                Sign In
            </button>
            <button id="tab-btn-register" onclick="switchAuthTab('register')" class="flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white">
                Create Account
            </button>
        </div>

        <!-- Alert box -->
        <div id="alert-msg" class="hidden mb-4 p-3 rounded-xl text-xs text-center font-medium"></div>

        <!-- 1. Sign In Form -->
        <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="login-id">
                    Username, Email, or Master Pass
                </label>
                <input 
                    type="text" 
                    id="login-id" 
                    required 
                    placeholder="Enter username or email" 
                    class="w-full px-3.5 py-2.5 bg-dark-950 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition"
                />
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5" for="login-password">
                    Password
                </label>
                <div class="relative">
                    <input 
                        type="password" 
                        id="login-password" 
                        required 
                        placeholder="••••••••" 
                        class="w-full px-3.5 py-2.5 bg-dark-950 border border-slate-700/80 rounded-xl text-sm text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 transition"
                    />
                    <button type="button" onclick="togglePassVisibility('login-password')" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-200 text-xs">
                        👁️
                    </button>
                </div>
            </div>

            <button 
                type="submit" 
                id="btn-login-submit"
                class="w-full py-3 px-4 bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-cyan-950/50 transition duration-150 flex items-center justify-center space-x-2"
            >
                <span>Unlock Portfolio Console</span>
                <span>→</span>
            </button>
        </form>

        <!-- 2. Create Account Form -->
        <form id="form-register" onsubmit="handleRegister(event)" class="space-y-3.5 hidden">
            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1" for="reg-username">
                    Username
                </label>
                <input 
                    type="text" 
                    id="reg-username" 
                    required 
                    placeholder="e.g. investor_bob" 
                    class="w-full px-3 py-2 bg-dark-950 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
                />
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1" for="reg-email">
                    Email Address
                </label>
                <input 
                    type="email" 
                    id="reg-email" 
                    required 
                    placeholder="bob@example.com" 
                    class="w-full px-3 py-2 bg-dark-950 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
                />
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1" for="reg-password">
                    Password
                </label>
                <input 
                    type="password" 
                    id="reg-password" 
                    required 
                    placeholder="Choose a strong password" 
                    class="w-full px-3 py-2 bg-dark-950 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
                />
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1" for="reg-telegram">
                    Telegram Handle <span class="text-slate-500 font-normal lowercase">(optional)</span>
                </label>
                <input 
                    type="text" 
                    id="reg-telegram" 
                    placeholder="@username" 
                    class="w-full px-3 py-2 bg-dark-950 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
                />
            </div>

            <div>
                <div class="flex items-center justify-between mb-1">
                    <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider" for="reg-gemini">
                        Gemini API Key <span class="text-slate-500 font-normal lowercase">(optional)</span>
                    </label>
                    <a href="https://aistudio.google.com/" target="_blank" class="text-[10px] text-cyan-400 hover:underline">
                        Get Free Key ↗
                    </a>
                </div>
                <input 
                    type="password" 
                    id="reg-gemini" 
                    placeholder="AIzaSy..." 
                    class="w-full px-3 py-2 bg-dark-950 border border-slate-700/80 rounded-xl text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition"
                />
            </div>

            <!-- Encryption Assurance Banner -->
            <div class="p-2.5 bg-emerald-950/40 border border-emerald-800/60 rounded-xl text-[11px] text-emerald-300 flex items-start space-x-2">
                <span class="text-sm">🔒</span>
                <p class="leading-relaxed">
                    <strong class="font-bold text-emerald-200">AES-256 Encrypted at Rest:</strong> Your Gemini API key is encrypted on the server, used only for your portfolio queries, and never shared.
                </p>
            </div>

            <button 
                type="submit" 
                id="btn-reg-submit"
                class="w-full py-2.5 px-4 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-emerald-950/50 transition duration-150 flex items-center justify-center space-x-2"
            >
                <span>Create Account</span>
                <span>→</span>
            </button>
        </form>

        <!-- Security Footer -->
        <div class="mt-6 pt-5 border-t border-slate-800/80 text-center">
            <div class="flex items-center justify-center space-x-2 text-[11px] text-slate-500">
                <span>🛡️ AES-256 Multi-Tenant Isolation</span>
                <span>•</span>
                <span>Zero-Knowledge BYOK AI</span>
            </div>
        </div>
    </div>

    <script>
        let currentTab = 'login';

        function switchAuthTab(tab) {
            currentTab = tab;
            const btnLogin = document.getElementById('tab-btn-login');
            const btnReg = document.getElementById('tab-btn-register');
            const formLogin = document.getElementById('form-login');
            const formReg = document.getElementById('form-register');
            const alertBox = document.getElementById('alert-msg');
            alertBox.classList.add('hidden');

            if (tab === 'login') {
                btnLogin.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition bg-cyan-600 text-white shadow-sm';
                btnReg.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white';
                formLogin.classList.remove('hidden');
                formReg.classList.add('hidden');
            } else {
                btnLogin.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition text-slate-400 hover:text-white';
                btnReg.className = 'flex-1 py-2 text-xs font-bold rounded-lg transition bg-emerald-600 text-white shadow-sm';
                formLogin.classList.add('hidden');
                formReg.classList.remove('hidden');
            }
        }

        function showAlert(msg, isError = true) {
            const alertBox = document.getElementById('alert-msg');
            alertBox.textContent = msg;
            alertBox.classList.remove('hidden');
            if (isError) {
                alertBox.className = 'mb-4 p-3 bg-red-950/60 border border-red-800/50 rounded-xl text-xs text-red-300 text-center font-medium';
            } else {
                alertBox.className = 'mb-4 p-3 bg-emerald-950/60 border border-emerald-800/50 rounded-xl text-xs text-emerald-300 text-center font-medium';
            }
        }

        function togglePassVisibility(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-login-submit');
            const usernameOrEmail = document.getElementById('login-id').value;
            const password = document.getElementById('login-password').value;

            btn.disabled = true;
            btn.innerHTML = '<span>Verifying Credentials...</span>';

            try {
                const resp = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username_or_email: usernameOrEmail, password: password })
                });
                const data = await resp.json();

                if (resp.ok && data.status === 'success') {
                    btn.innerHTML = '<span>✓ Authorized. Redirecting...</span>';
                    window.location.href = '/';
                } else {
                    showAlert(data.detail || 'Authentication failed. Please check your credentials.');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Unlock Portfolio Console</span><span>→</span>';
                }
            } catch (err) {
                showAlert('Network connection error: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = '<span>Unlock Portfolio Console</span><span>→</span>';
            }
        }

        async function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-reg-submit');
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const telegram = document.getElementById('reg-telegram').value;
            const geminiKey = document.getElementById('reg-gemini').value;

            btn.disabled = true;
            btn.innerHTML = '<span>Creating Secure Account...</span>';

            try {
                const resp = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: username,
                        email: email,
                        password: password,
                        telegram_username: telegram,
                        gemini_api_key: geminiKey
                    })
                });
                const data = await resp.json();

                if (resp.ok && data.status === 'success') {
                    btn.innerHTML = '<span>✓ Account Created! Redirecting...</span>';
                    window.location.href = '/';
                } else {
                    showAlert(data.detail || 'Registration failed.');
                    btn.disabled = false;
                    btn.innerHTML = '<span>Create Account</span><span>→</span>';
                }
            } catch (err) {
                showAlert('Network error: ' + err.message);
                btn.disabled = false;
                btn.innerHTML = '<span>Create Account</span><span>→</span>';
            }
        }
    </script>
</body>
</html>
