# Ruff configuration for Financial Sentinel
target-version = "py311"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "W",    # pycodestyle warnings
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
]
ignore = [
    "E501", # Line too long
    "E402", # Module level import not at top of file
    "B008", # FastAPI Depends in argument defaults
    "B904", # Within an except clause, raise ... from err (FastAPI HTTPException idiom)
    "B905", # zip() strict parameter (not supported on Python 3.9)
    "W291", # Trailing whitespace

    "W293", # Blank line contains whitespace
    "S104", # Possible binding to 0.0.0.0 (required for Cloud Run / Docker containers)
]

[lint.per-file-ignores]
"tests/*" = ["F841", "S101", "S105", "S106"]
"agents/*" = ["S110", "S112"]
"analytics/*" = ["S110", "S112"]
"channels/*" = ["S110", "S112"]
"orchestrator.py" = ["S110", "S112"]
"scheduler.py" = ["S110", "S112"]
"storage/state_store.py" = ["S110", "S112"]
"web/app.py" = ["S110", "S112"]


